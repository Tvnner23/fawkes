<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fawkes managed development console</title><link rel="stylesheet" href="/dev-console/console.css"><link rel="stylesheet" href="/native-attention.css">
<script src="/preview-login.js" defer></script></head><body>
<main id="console-login"><h1>Fawkes console</h1><p>FAWKES MANAGED DEVELOPMENT CONSOLE</p>

<form id="login"><label for="credential">App credential</label><input id="credential" type="password" autocomplete="current-password" required>
<button type="submit">Open console</button></form><p id="login-result" role="status"></p></main></body></html>
